name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: build + migrate + integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # NOTE: we deliberately start postgres + redis with `docker run
    # --network host` instead of GitHub's `services:` block. The service
    # hostnames (postgres/redis) resolved through the job DNS were flaky
    # here (getaddrinfo EAI_AGAIN, every couple minutes) — the runner's
    # service-name DNS alias does not stay resolvable on this infra. Host
    # networking gives us plain localhost URLs and no DNS dependency.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start dependencies (docker, host network)
        run: |
          set -e
          docker run -d --name bedrock-rp-postgres --network host \
            -e POSTGRES_USER=bedrock_rp \
            -e POSTGRES_PASSWORD=changeme \
            -e POSTGRES_DB=bedrock_rp \
            postgres:16
          docker run -d --name bedrock-rp-redis --network host redis:7
          for i in $(seq 1 30); do
            if docker exec bedrock-rp-postgres pg_isready -U bedrock_rp >/dev/null 2>&1 \
               && docker exec bedrock-rp-redis redis-cli ping | grep -q PONG; then
              echo "dependencies ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "dependencies never became ready" >&2
          exit 1

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build (TypeScript)
        working-directory: backend
        run: npm run build

      - name: Integration suite (build + migrate + 33/33)
        working-directory: backend
        env:
          CI_TEST_DB_URL: postgres://bedrock_rp:changeme@localhost:5432/bedrock_rp_test
          CI_ADMIN_DB_URL: postgres://bedrock_rp:changeme@localhost:5432/bedrock_rp
          CI_REDIS_URL: redis://localhost:6379
        run: npm test

  nbt-patch:
    name: leveldat_patch.py self-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run patcher self-check
        run: |
          python3 tools/leveldat_patch.py --self-test

  build-exe:
    name: build control-cli EXE (pkg)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build EXEs
        working-directory: tools
        run: npx -y pkg@5.8.1 .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: control-cli-exe
          path: tools/dist-exe/
          if-no-files-found: error
